---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  selector:
    matchLabels:
      app: webapp
  replicas: 2
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: assignment2webappaks
        image: assignment2webappkcontainerregistry.azurecr.io/assignment2webappimg:v1
        ports:
        - containerPort: 8080